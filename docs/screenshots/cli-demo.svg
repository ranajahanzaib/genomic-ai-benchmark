    <text y="40">  <tspan class="t-key">"command"</tspan><tspan class="t-punct">: </tspan><tspan class="t-str">"evaluate"</tspan><tspan class="t-punct">,</tspan></text>
    <text y="58">  <tspan class="t-key">"fixture_id"</tspan><tspan class="t-punct">: </tspan><tspan class="t-str">"synthetic-promoter-demo-v1"</tspan><tspan class="t-punct">,</tspan></text>
    <text y="76">  <tspan class="t-key">"fixture_sha256"</tspan><tspan class="t-punct">: </tspan><tspan class="t-str">"374ed6d04f34827259e0db3d3f9da41f57969b2df4b7a22f04695058e1441b07"</tspan><tspan class="t-punct">,</tspan></text>
    <text y="94">  <tspan class="t-key">"manifest_version"</tspan><tspan class="t-punct">: </tspan><tspan class="t-num">1</tspan><tspan class="t-punct">,</tspan></text>

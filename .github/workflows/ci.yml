name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.lock

      - name: Run API and scientific tests
        run: python -m pytest -v

      - name: Lint Python
        run: python -m ruff check research services/api

      - name: Check Python formatting
        run: python -m ruff format --check research services/api

      - name: Check CLI workflows
        run: |
          python -m research.cli evaluate
          python -m research.cli leakage
          python -m research.cli validate-split

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm --dir apps/web install --frozen-lockfile

      - name: Check web app
        run: |
          pnpm --dir apps/web run typecheck
          pnpm --dir apps/web run lint
          pnpm --dir apps/web run build

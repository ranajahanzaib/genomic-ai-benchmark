    <text y="346">      <tspan class="t-punct">{ </tspan><tspan class="t-key">"id"</tspan><tspan class="t-punct">: </tspan><tspan class="t-str">"demo-a1"</tspan><tspan class="t-punct">, </tspan><tspan class="t-key">"species"</tspan><tspan class="t-punct">: </tspan><tspan class="t-str">"species-a"</tspan><tspan class="t-punct">, </tspan><tspan class="t-key">"truth"</tspan><tspan class="t-punct">: </tspan><tspan class="t-str">"motif-present"</tspan><tspan class="t-punct">, </tspan><tspan class="t-key">"prediction"</tspan><tspan class="t-punct">: </tspan><tspan class="t-str">"motif-present"</tspan><tspan class="t-punct"> },</tspan></text>
    <text y="364">      <tspan class="t-punct">{ </tspan><tspan class="t-key">"id"</tspan><tspan class="t-punct">: </tspan><tspan class="t-str">"demo-a2"</tspan><tspan class="t-punct">, </tspan><tspan class="t-key">"species"</tspan><tspan class="t-punct">: </tspan><tspan class="t-str">"species-a"</tspan><tspan class="t-punct">, </tspan><tspan class="t-key">"truth"</tspan><tspan class="t-punct">: </tspan><tspan class="t-str">"motif-absent"</tspan><tspan class="t-punct">, </tspan><tspan class="t-key">"prediction"</tspan><tspan class="t-punct">: </tspan><tspan class="t-str">"motif-absent"</tspan><tspan class="t-punct"> },</tspan></text>
    <text y="382">      <tspan class="t-punct">{ </tspan><tspan class="t-key">"id"</tspan><tspan class="t-punct">: </tspan><tspan class="t-str">"demo-b1"</tspan><tspan class="t-punct">, </tspan><tspan class="t-key">"species"</tspan><tspan class="t-punct">: </tspan><tspan class="t-str">"species-b"</tspan><tspan class="t-punct">, </tspan><tspan class="t-key">"truth"</tspan><tspan class="t-punct">: </tspan><tspan class="t-str">"motif-present"</tspan><tspan class="t-punct">, </tspan><tspan class="t-key">"prediction"</tspan><tspan class="t-punct">: </tspan><tspan class="t-str">"motif-present"</tspan><tspan class="t-punct"> },</tspan></text>
    <text y="400">      <tspan class="t-comment">... 5 more held-out evaluation predictions ...</tspan></text>
    <text y="418">    <tspan class="t-punct">]</tspan></text>
    <text y="436">  <tspan class="t-punct">}</tspan></text>
    <text y="454"><tspan class="t-punct">}</tspan></text>

